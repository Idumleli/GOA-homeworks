
<!-- ფორმატირების თეგები:
<b></b> -> bold tag - აღნიშნული თეგი ამუქებს ტექსტს
<i></i> -> italic - დახრილი ტექსტი
<u></u> -> underline - სიტყვის ქვემოთ ხაზი
სემანტიკური - მნიშვნელობა, ინფორმაცია, რომელიც გადმოიცემა ენობრივი ფორმებით – სიტყვით, ფრაზით თუ წინადადებით.
სემანტიკური თეგების მაგალითებია: 
<strong></strong>
<em></em> -> emphasis -->


<!-- <b></b>, <i></i>, <strong></strong>, <em></em> - ამ თეგებს შორის მსგავსება წარმოადგენს იმაში რომ ოთხივე აღნიშნული თეგი არ საჭიროებს მთლიანი ხაზის (სივრცის) დაკავებას, ასევე თითოეული მათგანი არის conteiner tag (გამხსნელი და დამხურავი თეგები). <b></b> და <strong> თეგები ორივე მუქი ფორმატითაა მსგვსია თუმცა განსხვავება ისაა რომ <strong> თეგს სემანტიური მნიშვნელობა გააჩნია. ასევე <i></i> და <em></em> თეგები ერთნაირად დახრილი ტექსტით წარმოგვიდგება თუმცა, <em> თეგსაც italic-ისგან გასხვავებით სემანტიური მნიშვნელოვბა აქვს.
